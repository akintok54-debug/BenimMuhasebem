<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayi Portalı · BenimMuhasebe</title><link rel="stylesheet" href="/b2b/b2b.css?v=1.4.5"><script src="/hata-izleme.js?v=1.3.0" defer></script><script src="/erp/belge-sunum.js" defer></script><script src="/b2b/portal.js?v=1.4.5" defer></script></head>
<body class="b2b"><header class="b2b-header"><a href="/b2b/" class="b2b-brand">BenimMuhasebe <span>BAYİ PORTALI</span></a><span id="identity"></span><button id="logout" hidden>Çıkış</button></header>
<div id="message" role="status" aria-live="polite"></div>
<main id="login" class="b2b-login"><p class="eyebrow">İŞ ORTAKLARIMIZ İÇİN</p><p id="companyName" class="eyebrow"></p><h1>İşinizin her adımı,<br>tek portalda.</h1><p>Ürünleri inceleyin, sipariş verin ve cari hesabınızı takip edin.</p><form id="loginForm"><label>E-posta veya cep telefonu<input name="kimlik" type="text" autocomplete="username" maxlength="254" placeholder="E-posta veya 05xx xxx xx xx" required></label><label>Parola<input name="sifre" type="password" autocomplete="current-password" required></label><button class="primary">Giriş yap</button></form><form id="mfaForm" hidden><label>Doğrulama veya kurtarma kodu<input name="kod" autocomplete="one-time-code" required></label><button class="primary">Doğrula</button></form><a href="/b2b/sifre.html">Şifremi unuttum</a></main>
<div id="portal" hidden><nav class="b2b-nav" aria-label="Bayi menüsü"><button data-view="catalog">Ürün kataloğu</button><button data-view="favorites">Favoriler</button><button data-view="cart">Sepet <span id="cartCount">0</span></button><button data-view="orders">Siparişlerim</button><button data-view="ledger">Cari ekstre</button><button data-view="documents">Belgelerim</button><button data-view="payments">Ödeme bilgileri</button></nav><main id="view" class="b2b-main"></main></div>
<dialog id="productImageDialog" aria-labelledby="productImageTitle"><button id="closeProductImage" class="close" type="button" autofocus>Kapat ×</button><h2 id="productImageTitle"></h2><div id="productImageBody"></div><p id="productImageInfo"></p></dialog>
<dialog id="detail"><button id="closeDetail" class="close" aria-label="Kapat">Kapat</button><div id="detailBody"></div><button id="printDetail">Yazdır / PDF kaydet</button></dialog>
</body></html>
