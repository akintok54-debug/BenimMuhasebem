<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parola Yenile - benimmuhasebe.com</title>
    <link rel="stylesheet" href="/erp/login.css?v=20260827-003">
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <div class="brand"><span class="brand-mark">BM</span><strong>benimmuhasebe.com</strong><span>İşletme Yönetimi</span></div>
        <h1>Parola Yenile</h1>
        <p>Yeni parolanız en az 8 karakter olmalıdır.</p>
        <form id="resetForm">
            <label>Yeni parola<input id="yeniSifre" type="password" minlength="8" autocomplete="new-password" required></label>
            <label>Yeni parola tekrar<input id="yeniSifreTekrar" type="password" minlength="8" autocomplete="new-password" required></label>
            <div id="mesaj"></div>
            <button id="resetBtn">Parolayı Yenile</button>
        </form>
        <div class="login-security"><a href="/erp/login.html">Giriş ekranına dön</a></div>
    </div>
</div>
<script src="/erp/sifre-yenile.js"></script>
</body>
</html>
