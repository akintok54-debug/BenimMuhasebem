<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Cari Hesap Ekstresi</title><style>:root{font-family:Inter,Arial,sans-serif;color:#172033;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;padding:32px}.page{max-width:1050px;margin:auto;background:#fff;border-radius:16px;box-shadow:0 8px 30px #1a2b4914;padding:34px}.head,.party,.total{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.head{border-bottom:2px solid #e7ecf3;padding-bottom:22px}.head h1{margin:0 0 6px;font-size:25px}.muted{color:#6b7587}.party{margin:25px 0;padding:18px;background:#f7f9fc;border-radius:12px}.party strong{display:block;font-size:18px;margin-top:5px}.balance{text-align:right}.balance strong{font-size:24px;color:#1b61c2}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid #e8edf4;text-align:left}th{background:#f7f9fc;color:#4d596c}.num{text-align:right}.total{justify-content:flex-end;margin-top:24px;font-size:18px}.foot{margin-top:22px;padding-top:16px;border-top:1px solid #e8edf4;font-size:12px;color:#6b7587}.error{max-width:700px;margin:80px auto;background:#fff1f1;color:#a02727;padding:24px;border-radius:12px}@media(max-width:700px){body{padding:10px}.page{padding:18px}.party{display:block}.balance{text-align:left;margin-top:16px}.scroll{overflow:auto}table{min-width:720px}}@media print{body{padding:0;background:#fff}.page{box-shadow:none}}</style></head><body><main id="app"><section class="page">Ekstre yükleniyor…</section></main><script>
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));const money=v=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(Number(v||0));
(async()=>{const app=document.getElementById("app"),token=new URLSearchParams(location.search).get("token");try{if(!token)throw new Error("Ekstre bağlantısı eksik.");const response=await fetch(`/api/tenant/cari/paylasim/${encodeURIComponent(token)}`,{cache:"no-store",referrerPolicy:"no-referrer"}),data=await response.json();if(!response.ok)throw new Error(data.mesaj||"Ekstre alınamadı.");let bakiye=0;const rows=data.hareketler.map(h=>{const borc=h.tip==="BORC"?Number(h.tutar||0):0,alacak=["ALACAK","TAHSILAT","ODEME","IADE"].includes(h.tip)?Number(h.tutar||0):0;bakiye+=borc-alacak;return{...h,borc,alacak,bakiye}}).reverse(),m=data.musteri,f=data.firma||{};document.title=`${f.unvan||"Firma"} · Cari Hesap Ekstresi`;app.innerHTML=`<section class="page"><header class="head"><div><h1>${esc(f.unvan||"İşletme")}</h1><div class="muted">Cari Hesap Ekstresi</div></div><div>${esc(f.telefon||"")}<br>${esc(f.email||"")}</div></header><div class="party"><div><span class="muted">MÜŞTERİ</span><strong>${esc(m.unvan||m.adSoyad||"-")}</strong><span class="muted">Kod: ${esc(m.kod||"-")}</span></div><div class="balance"><span class="muted">GÜNCEL BAKİYE</span><strong>${money(m.bakiye)}</strong></div></div><div class="scroll"><table><thead><tr><th>Tarih</th><th>Tür</th><th>Açıklama</th><th>Belge</th><th class="num">Borç</th><th class="num">Alacak</th><th class="num">Bakiye</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${new Date(r.tarih).toLocaleDateString("tr-TR")}</td><td>${esc(r.tip)}</td><td>${esc(r.aciklama||"-")}</td><td>${esc(r.belgeNo||"-")}</td><td class="num">${r.borc?money(r.borc):"-"}</td><td class="num">${r.alacak?money(r.alacak):"-"}</td><td class="num"><b>${money(r.bakiye)}</b></td></tr>`).join(""):`<tr><td colspan="7">Henüz cari hareket bulunmuyor.</td></tr>`}</tbody></table></div><div class="total">Güncel bakiye:&nbsp; <b>${money(m.bakiye)}</b></div><footer class="foot">Bu hesap özeti ${esc(f.unvan||"firma")} tarafından işlem kapsamında paylaşılmıştır. Bağlantı ${data.sonGecerlilik?new Date(data.sonGecerlilik).toLocaleDateString("tr-TR"):"belirtilen tarihe kadar"} geçerlidir.</footer></section>`}catch(e){app.innerHTML=`<div class="error"><b>Ekstre açılamadı</b><p>${esc(e.message)}</p></div>`}})();
</script></body></html>
