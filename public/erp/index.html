<!DOCTYPE html>
<html lang="tr">

<head>
    <script src="/hata-izleme.js?v=1.3.0"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>benimmuhasebe.com İşletme Yönetimi</title>
    <link rel="stylesheet" href="/erp/belge-sunum.css?v=20260906-release02">
    <link rel="stylesheet" href="/erp/erp.css?v=20260909-release07">
    <link rel="stylesheet" href="/b2b/b2b.css?v=20260909-release07">
</head>

<body>

    <div id="app">

        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">BM</span>
                <span class="brand-copy">
                    <strong>benimmuhasebe.com</strong>
                    <span>İşletme Yönetimi</span>
                </span>
            </div>

            <nav aria-label="Ana menü">
                <section class="nav-group" aria-labelledby="navGenel">
                    <h2 id="navGenel">Genel</h2>
                    <button data-page="dashboard"><span class="nav-icon" aria-hidden="true">⌂</span><span>Ana Sayfa</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navSatis">
                    <h2 id="navSatis">Satış</h2>
                    <button data-page="satis"><span class="nav-icon" aria-hidden="true">↗</span><span>Satışlar</span></button>
                    <button data-page="b2b"><span class="nav-icon" aria-hidden="true">◈</span><span>B2B Bayi Yönetimi</span></button>
                    <button data-page="siparisler"><span class="nav-icon" aria-hidden="true">▣</span><span>Siparişler</span></button>
                    <button data-page="teklifler"><span class="nav-icon" aria-hidden="true">≡</span><span>Teklifler</span></button>
                    <button data-page="musteriler"><span class="nav-icon" aria-hidden="true">◎</span><span>Müşteriler</span></button>
                    <button data-page="saha"><span class="nav-icon" aria-hidden="true">◉</span><span>Saha Satış</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navAlis">
                    <h2 id="navAlis">Satın Alma</h2>
                    <button data-page="alis"><span class="nav-icon" aria-hidden="true">↙</span><span>Alışlar</span></button>
                    <button data-page="tedarikciler"><span class="nav-icon" aria-hidden="true">◇</span><span>Tedarikçiler</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navStok">
                    <h2 id="navStok">Stok</h2>
                    <button data-page="urunler"><span class="nav-icon" aria-hidden="true">▦</span><span>Ürünler</span></button>
                    <button data-page="stok"><span class="nav-icon" aria-hidden="true">▤</span><span>Stok ve Depolar</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navFinans">
                    <h2 id="navFinans">Finans</h2>
                    <button data-page="cari"><span class="nav-icon" aria-hidden="true">⇄</span><span>Cari Hesaplar</span></button>
                    <button data-page="finans"><span class="nav-icon" aria-hidden="true">₺</span><span>Kasa / Banka</span></button>
                    <button data-page="masraflar"><span class="nav-icon" aria-hidden="true">−</span><span>Masraflar</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navYonetim">
                    <h2 id="navYonetim">Yönetim</h2>
                    <button data-page="personeller"><span class="nav-icon" aria-hidden="true">○</span><span>Personel</span></button>
                    <button data-page="kullanicilar"><span class="nav-icon" aria-hidden="true">⚙</span><span>Kullanıcılar / Yetkiler</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navRaporlama">
                    <h2 id="navRaporlama">Raporlama</h2>
                    <button data-page="raporlar"><span class="nav-icon" aria-hidden="true">▥</span><span>Raporlar</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navKanallar">
                    <h2 id="navKanallar">Kanallar</h2>
                    <button data-page="eticaret"><span class="nav-icon" aria-hidden="true">◈</span><span>E-Ticaret</span></button>
                    <button data-page="whatsapp"><span class="nav-icon" aria-hidden="true">◇</span><span>WhatsApp</span></button>
                </section>
                <section class="nav-group" aria-labelledby="navSistem">
                    <h2 id="navSistem">Sistem</h2>
                    <button data-page="ayarlar"><span class="nav-icon" aria-hidden="true">⚙</span><span>Ayarlar</span></button>
                </section>
            </nav>

        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-title">
                    <button id="menuToggle" class="menu-toggle" type="button" aria-label="Menüyü aç/kapat">☰</button>
                    <div>
                        <h1 id="pageTitle">Ana Sayfa</h1>
                        <span id="tenantInfo">İşletme hesabınız aktif</span>
                    </div>
                </div>
                <div class="topbar-actions">
                    <button id="accountButton" class="account-button" type="button"><span
                            class="account-avatar">H</span><span><strong>Hesabım</strong><small>Profil ve
                                güvenlik</small></span></button>
                    <button id="logoutButton" class="logout topbar-logout" type="button">Çıkış Yap</button>
                </div>
            </header>

            <section id="content"></section>
        </main>

    </div>

    <script src="/api/assets/xlsx.js?v=0.18.5"></script>
    <script src="/api/assets/jszip.js?v=3"></script>
    <script src="/erp/belge-sunum.js?v=20260906-release02"></script>
    <script src="/b2b/admin.js"></script>
    <script src="/erp/erp.js?v=20260909-release07"></script>

</html>
