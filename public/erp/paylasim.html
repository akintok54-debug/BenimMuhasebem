<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="referrer" content="no-referrer">
    <title>Firma Belgesi</title>
    <style>
        :root{font-family:Inter,Arial,sans-serif;color:#162033;background:#eef2f7}*{box-sizing:border-box}body{margin:0;padding:28px}.page{max-width:1120px;margin:auto;background:#fff;border-radius:18px;box-shadow:0 12px 38px #17203316;padding:34px}.head{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #e7ebf1;padding-bottom:22px}.brand h1{margin:0 0 5px;font-size:27px}.muted{color:#687387}.meta{text-align:right}.party{display:flex;justify-content:space-between;gap:20px;margin:22px 0;padding:18px;background:#f7f9fc;border-radius:12px}.party strong{display:block;font-size:18px;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.product{border:1px solid #e3e8ef;border-radius:13px;overflow:hidden}.product img{width:100%;height:150px;object-fit:contain;background:#f7f9fc}.product .info{padding:14px}.product h3{font-size:15px;margin:5px 0}.product small{display:block;color:#687387}.product b{display:block;margin-top:10px;color:#1857a8}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid #e7ebf1;text-align:left}th{background:#f7f9fc}.num{text-align:right}.totals{margin:20px 0 0 auto;max-width:350px}.totals div{display:flex;justify-content:space-between;padding:7px}.totals div:last-child{font-size:18px;border-top:2px solid #dce3ec}.foot{margin-top:28px;padding-top:18px;border-top:1px solid #e7ebf1;color:#687387;font-size:13px}.error{max-width:680px;margin:80px auto;background:#fff1f1;color:#9d2525;padding:24px;border-radius:14px}@media(max-width:700px){body{padding:8px}.page{padding:18px}.head,.party{display:block}.meta{text-align:left;margin-top:12px}.grid{grid-template-columns:1fr 1fr}.product img{height:120px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}@media print{body{padding:0;background:#fff}.page{box-shadow:none}.product{break-inside:avoid}}
    </style>
</head>
<body><main id="app"><section class="page">Belge güvenli bağlantıdan yükleniyor…</section></main>
<script>
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const para=(v,c="TRY")=>new Intl.NumberFormat("tr-TR",{style:"currency",currency:["TRY","USD","EUR"].includes(c)?c:"TRY"}).format(Number(v||0));
const tarih=v=>v?new Date(v).toLocaleDateString("tr-TR"):"-";
function firmaHtml(f){return `<header class="head"><div class="brand"><h1>${esc(f.unvan||"İşletme")}</h1><span class="muted">${esc([f.ilce,f.il].filter(Boolean).join(" / "))}</span></div><div class="meta">${f.telefon?`<div>${esc(f.telefon)}</div>`:""}${f.email?`<div>${esc(f.email)}</div>`:""}${f.web?`<div>${esc(f.web)}</div>`:""}</div></header>`}
function katalog(p){const u=p.belge.urunler||[];return `${firmaHtml(p.firma)}<div class="party"><div><span class="muted">ÜRÜN KATALOĞU</span><strong>${esc(p.baslik)}</strong><span class="muted">${u.length} ürün</span></div><div><span class="muted">Bağlantı geçerlilik tarihi</span><strong>${tarih(p.sonGecerlilikTarihi)}</strong></div></div><div class="grid">${u.map(x=>`<article class="product">${x.gorsel?`<img src="${esc(x.gorsel)}" alt="${esc(x.ad)}" loading="lazy" referrerpolicy="no-referrer">`:""}<div class="info"><small>${esc([x.kategori,x.marka,x.model].filter(Boolean).join(" · "))}</small><h3>${esc(x.ad)}</h3><small>Kod: ${esc(x.kod)} · ${esc(x.birim||"ADET")}</small><b>${para(x.satisFiyati,x.paraBirimi)}</b></div></article>`).join("")}</div>`}
function belge(p){const b=p.belge,m=b.musteriId||{},kalemler=b.kalemler||[];return `${firmaHtml(p.firma)}<div class="party"><div><span class="muted">${p.tur==="TEKLIF"?"TEKLİF VERİLEN":"SİPARİŞ VEREN"}</span><strong>${esc(m.unvan||m.adSoyad||"Müşteri")}</strong><span class="muted">Müşteri kodu: ${esc(m.kod||"-")}</span></div><div><span class="muted">BELGE</span><strong>${esc(b.teklifNo||b.siparisNo||"-")}</strong><span class="muted">${tarih(b.tarih)} · ${esc(b.durum||"")}</span></div></div><div class="scroll"><table><thead><tr><th>Kod</th><th>Ürün</th><th class="num">Miktar</th><th class="num">Birim Fiyat</th><th class="num">İskonto</th><th class="num">KDV</th><th class="num">Toplam</th></tr></thead><tbody>${kalemler.map(k=>`<tr><td>${esc(k.urunId?.kod||"-")}</td><td>${esc(k.urunId?.ad||"Ürün")}</td><td class="num">${Number(k.miktar||0)} ${esc(k.urunId?.birim||"")}</td><td class="num">${para(k.birimFiyat,k.urunId?.paraBirimi)}</td><td class="num">%${Number(k.iskonto||0)}</td><td class="num">%${Number(k.kdv||0)}</td><td class="num"><b>${para(k.toplam,k.urunId?.paraBirimi)}</b></td></tr>`).join("")}</tbody></table></div><div class="totals"><div><span>Ara toplam</span><b>${para(b.araToplam)}</b></div><div><span>KDV</span><b>${para(b.toplamKdv)}</b></div><div><span>Genel toplam</span><b>${para(b.genelToplam)}</b></div></div>${b.notlar?`<div class="party"><div><span class="muted">AÇIKLAMA</span><p>${esc(b.notlar)}</p></div></div>`:""}`}
(async()=>{const app=document.getElementById("app"),token=new URLSearchParams(location.search).get("token");try{if(!token)throw new Error("Paylaşım bağlantısı eksik.");const res=await fetch(`/api/paylasim/${encodeURIComponent(token)}`,{cache:"no-store",referrerPolicy:"no-referrer"}),data=await res.json();if(!res.ok)throw new Error(data.mesaj||"Belge alınamadı.");const p=data.paylasim;document.title=`${p.baslik} · ${p.firma?.unvan||"Firma"}`;app.innerHTML=`<section class="page">${p.tur==="KATALOG"?katalog(p):belge(p)}<footer class="foot">Bu belge ${esc(p.firma?.unvan||"firma")} tarafından işlem kapsamında paylaşılmıştır. Bağlantıyı yalnızca yetkili alıcılarla paylaşınız.</footer></section>`}catch(e){app.innerHTML=`<div class="error"><b>Belge açılamadı</b><p>${esc(e.message)}</p></div>`}})();
</script></body></html>
